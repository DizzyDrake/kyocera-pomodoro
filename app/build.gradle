plugins { id 'com.android.application' }

android {
    namespace 'org.roarin.durapomodoro'
    compileSdk 33
    defaultConfig {
        applicationId 'org.roarin.durapomodoro'
        minSdk 26
        targetSdk 29
        versionCode 13
        versionName '0.2.1'
    }
    // Debug is a separate preview app. It cannot overwrite the owner's working
    // v0.1.11 installation; only a matching-key signed release can upgrade it.
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: 'Dura Pomodoro']
        }
        release {
            manifestPlaceholders = [appLabel: 'Dura Pomodoro']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
